# Build MLWSVM and run every test mode on Linux (GCC and Clang) and macOS,
# and the JIT's on Linux on arm64.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libffi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev pkg-config

      # ThreadSanitizer cannot map its shadow memory with the kernel's default
      # mmap randomisation on recent Ubuntu images.
      - name: Allow ThreadSanitizer (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build
        run: make CC=$CC -k -j4

      - name: Tests
        run: make CC=$CC test

      - name: Embedding library and example host
        run: make CC=$CC lib check-embed

      - name: Tests on one worker thread
        run: MLWSVM_THREADS=1 ./mlwsvm test tests examples

      - name: GC stress
        run: make CC=$CC check-gc

      - name: Optimizer (every module with every pass, also with GC stress)
        run: make CC=$CC check-opt

      - name: JIT (every function and block, also with GC stress and the optimizer; hot functions)
        run: make CC=$CC check-jit

      - name: Fuzzer (random programs in every mode against the interpreter)
        run: make CC=$CC check-fuzz

      - name: Tools (monitor, top, profiler, tracer)
        run: make CC=$CC check-tools

      - name: Bindings generator (clang)
        run: make CC=$CC check-bindgen

      - name: AddressSanitizer + UBSan (+ LeakSanitizer on Linux)
        run: make CC=$CC check-asan

      - name: ThreadSanitizer
        run: make CC=$CC check-tsan

      - name: Switch dispatch (no computed goto)
        run: make CC=$CC check-switch

      - name: Dispatch loop (no tail calls)
        run: make CC=$CC check-loop

      - name: Register windows filled with garbage before a call clears them
        run: make CC=$CC check-poison

      - name: Without libffi
        run: |
          make CC=$CC BUILD=build-noffi BIN=mlwsvm-noffi FFI=0 -j4
          ./mlwsvm-noffi test tests examples

      # bench/connections.masm holds 20,000 descriptors open: more than the
      # macOS runner's per-process limit allows.
      - name: Raise the open-file limit (macOS)
        if: runner.os == 'macOS'
        run: sudo sysctl -w kern.maxfiles=100000 kern.maxfilesperproc=65536

      - name: Benchmarks (output checks)
        run: |
          ulimit -n 65536 2>/dev/null || true
          sh bench/run.sh ./mlwsvm

  # The JIT's code memory and arm64 code on Linux (the jobs above: x86-64
  # Linux, arm64 macOS).
  arm64-linux:
    name: ubuntu-24.04-arm / clang (JIT)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install libffi
        run: sudo apt-get update && sudo apt-get install -y libffi-dev pkg-config

      - name: Build
        run: make CC=$CC -k -j4

      - name: Tests
        run: make CC=$CC test

      - name: JIT (every function and block, also with GC stress and the optimizer; hot functions)
        run: make CC=$CC check-jit

      - name: Fuzzer (random programs in every mode against the interpreter)
        run: make CC=$CC check-fuzz

      - name: AddressSanitizer + UBSan, also with the JIT
        run: make CC=$CC check-asan
