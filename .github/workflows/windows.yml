# Build MLWSVM and run its tests on Windows (x86-64), with Clang in MSYS2's
# CLANG64 environment (the UCRT C runtime). The shell steps run in MSYS2's
# bash, so the Makefile and the test scripts are the same as elsewhere.
# (No sanitizer builds: MinGW has no ThreadSanitizer, and its
# AddressSanitizer is incomplete.) Every step runs after a failed one.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: windows-latest / clang
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            make
            diffutils
            perl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libffi
            mingw-w64-clang-x86_64-pkgconf

      - name: Build
        run: |
          rc=0; make CC=clang -k -j4 > build.log 2>&1 || rc=$?
          cat build.log; exit $rc

      # As the release check's build-warnings: a warning fails the run here,
      # at the push, not at the release.
      - name: No warnings
        if: ${{ !cancelled() }}
        run: "! grep -E 'warning:|error:' build.log"

      - name: The JIT is built in
        if: ${{ !cancelled() }}
        run: ./mlwsvm run --jit on --jit-hot 2 --jit-report - examples/fib.masm 2>&1 | grep -A2 "mlwsvm jit (x86-64)"

      - name: Tests
        if: ${{ !cancelled() }}
        run: make CC=clang test

      # mlwsvm.exe and lib/ in a directory of their own, run from PowerShell
      # with only Windows' own directories on PATH: no DLL of MSYS2's may be
      # needed. The tests that start POSIX commands (tests/os) stay out.
      - name: Runs on its own (no MSYS2)
        if: ${{ !cancelled() }}
        run: |
          llvm-objdump -p mlwsvm.exe build/ext/demo.mlwsx | grep "DLL Name" | tee build/dlls.txt
          if grep -vi -E "DLL Name: (kernel32|advapi32|ws2_32|bcrypt|api-ms-win-crt-[a-z0-9-]+)\.dll" build/dlls.txt; then
            echo "a DLL that is not Windows' own (above)"; exit 1
          fi

      - name: Runs on its own (PowerShell, Windows' PATH)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "mlwsvm"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item mlwsvm.exe $dist
          Copy-Item -Recurse lib (Join-Path $dist "lib")
          $env:PATH = "C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $vm = Join-Path $dist "mlwsvm.exe"
          & $vm version; if ($LASTEXITCODE) { exit 1 }
          & $vm run examples\hello.masm; if ($LASTEXITCODE) { exit 1 }
          & $vm run --jit on examples\fib.masm; if ($LASTEXITCODE) { exit 1 }
          & $vm test tests\basic tests\objects tests\processes tests\net tests\native tests\jit tests\lib tests\text examples\hello.masm; if ($LASTEXITCODE) { exit 1 }

      - name: Embedding library and example host
        if: ${{ !cancelled() }}
        run: make CC=clang lib check-embed

      - name: Tests on one worker thread
        if: ${{ !cancelled() }}
        run: MLWSVM_THREADS=1 ./mlwsvm test tests examples

      - name: GC stress
        if: ${{ !cancelled() }}
        run: make CC=clang check-gc

      - name: Optimizer (every module with every pass, also with GC stress)
        if: ${{ !cancelled() }}
        run: make CC=clang check-opt

      - name: JIT (every function and block, also with GC stress and the optimizer; hot functions)
        if: ${{ !cancelled() }}
        run: make CC=clang check-jit

      - name: Fuzzer (random programs in every mode against the interpreter)
        if: ${{ !cancelled() }}
        run: make CC=clang check-fuzz

      - name: Tools (monitor, top, profiler, tracer)
        if: ${{ !cancelled() }}
        run: make CC=clang check-tools

      - name: Bindings generator (clang)
        if: ${{ !cancelled() }}
        run: make CC=clang check-bindgen

      - name: Switch dispatch (no computed goto)
        if: ${{ !cancelled() }}
        run: make CC=clang check-switch

      - name: Dispatch loop (no tail calls)
        if: ${{ !cancelled() }}
        run: make CC=clang check-loop

      - name: Register windows filled with garbage before a call clears them
        if: ${{ !cancelled() }}
        run: make CC=clang check-poison

      - name: Without libffi
        if: ${{ !cancelled() }}
        run: |
          make CC=clang BUILD=build-noffi BIN=mlwsvm-noffi.exe FFI=0 -j4
          ./mlwsvm-noffi test tests examples

      - name: Benchmarks (output checks)
        if: ${{ !cancelled() }}
        run: sh bench/run.sh ./mlwsvm
